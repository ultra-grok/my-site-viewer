<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Plot Viewer</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Interactive Token Probability Plot</h1>
    <a href="index.html">← Back to Home</a>
    
    <h3 id="entryCounter">Loading...</h3>
    
    <div class="viewer-container">
        
        <div id="plot-wrapper">
            <div id="plot"></div>
        </div>

        <div id="text-container">Loading text...</div>

    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search text in samples...">
        <button id="searchBtn">Search</button>
        <span id="searchStatus"></span>
    </div>

    <div id="searchResultsContainer"></div>

    <div class="nav-buttons">
        <button id="prevBtn">← Previous</button>
        
        <div class="goto-container">
            <input type="number" id="goToInput" placeholder="Go to #..." min="1">
            <button id="goToBtn">Go</button>
        </div>
        
        <button id="nextBtn">Next →</button>
    </div>

    <script src="plot_viewer.js"></script>
</body>
</html>
